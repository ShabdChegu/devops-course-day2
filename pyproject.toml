[project]
name = "notes-app"
version = "0.1.0"
description = "Tiny Notes app - the running example for the DevOps course"
requires-python = ">=3.11"
dependencies = [
    # Pinned to one minor line so the course behaves the same on every
    # machine - uv.lock pins the exact versions.
    "fastapi>=0.115,<0.116",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes_app"]

# One tool owns lint and format - no flake8/black/isort split.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length is owned by `ruff format`
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep student output clean: this deprecation comes from inside
# starlette's TestClient (anyio), not from our code.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

# ch.5 - one command starts the app AND a real database.
#
#   make up         # docker compose --profile core up -d --build
#   make pipeline   # ch.7: start Jenkins + seed its polling job
#
# Profiles bound the footprint (PLAN item #3): `core` = app + db, and
# everything later chapters add (jenkins ch.7, monitoring ch.11, jaeger
# ch.12, signoz ch.13) gets its OWN profile so a 4GB laptop never has to
# run all of it. `make up` starts core only, by design.

services:
  app:
    build: .
    image: notes-app
    profiles: ["core"]
    depends_on:
      # The app creates its tables at import time - so Postgres must be
      # accepting connections first. `service_healthy` (not just "started")
      # is what makes this reliable.
      db:
        condition: service_healthy
    environment:
      # The ch.2 seam pays off: models.py builds its engine from DATABASE_URL.
      # Point it at Postgres here and NOT ONE LINE OF PYTHON CHANGES.
      # Note the driver dialect `postgresql+psycopg` - SQLAlchemy needs the
      # driver named in the URL (that's why `uv add psycopg` happened).
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      # ch.6: the log level knob - behavior from the environment, not code.
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    profiles: ["core"]
    # .env (yours, gitignored - see .env.example) feeds these interpolations.
    # Compose reads .env to fill in ${...} in THIS file; the containers
    # themselves never see the raw .env - app gets only DATABASE_URL,
    # db gets only its three POSTGRES_* vars.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume = the data OUTLIVES the container. ch.4's
      # "docker rm loses everything" problem, solved for good.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready: "is Postgres accepting connections?" - the exact
      # question depends_on above is waiting on.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 2s
      retries: 20
    ports:
      - "5432:5432" # so you can psql into it from the host; `make check` verifies 5432 is free first

  # ch.7 - Jenkins, in Docker: the controller runs in a container, and the
  # pipeline's job is to watch YOUR git repo and rebuild the app when you
  # push. That's what "CI" means here: a machine notices your commit before
  # you remember to run it.
  #
  #   make pipeline   # up this profile + seed the job (zero UI clicks)
  #
  # The ch.7 gotcha, documented (docs/07-jenkins-ci.md pitfall #1): the
  # pipeline needs `docker build` and `uv` - neither is in this image.
  # The host-socket mount drives the HOST's docker daemon; the host's tools
  # fill the gap. Same mount later carries to the VPS deploy in ch.8.
  jenkins:
    image: jenkins/jenkins:2.580.2-lts
    profiles: ["jenkins"]
    environment:
      # The host-socket's host: this container's `$HOME` is where the
      # pipeline's uv caches land, and where .env (the app password, ch.5)
      # is found. The Jenkinsfile mounts it explicitly.
      HOME: /var/jenkins_home
      JENKINS_PORT: 8080
      JENKINS_SLAVE_AGENT_PORT: 50000
    # --user root matters: the host-socket is owned by the host's root,
    # and the pipeline's stages run as root inside this container too.
    user: "0"
    volumes:
      # JENKINS_HOME on a NAMED volume: jobs, credentials, and uv's wheel
      # cache survive a container rebuild. ch.8's VPS gets the same.
      - jenkins_home:/var/jenkins_home
      # The gotcha itself, one line: the host daemon, visible from in here.
      - /var/run/docker.sock:/var/run/docker.sock
      # The pipeline checks the repo OUT of the host's clone, under /opt:
      # the poller and the checkout share one origin, so a push to a
      # FORK still fires (Jenkins polls the clone URL you give it - the
      # Jenkinsfile's SCM is set in scripts/jenkins-init.sh, not here).
      - /opt/course:/opt/course
    ports:
      # 13000 on the host -> 8080 in the container (Jenkins' default).
      # `make check` verifies 13000 is free first.
      - "13000:8080"

volumes:
  pgdata:
  jenkins_home:

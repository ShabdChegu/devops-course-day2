# ch.5 - one command starts the app AND a real database.
#
# This is the "app server": app + postgres, one compose project.
# ch.7's Jenkins is its OWN project - jenkins/docker-compose.yml, the
# "CI server" (one file = one machine; ch.8's VPS runs this same
# idea on the other side).
#
#   make up         # docker compose --profile core up -d --build
#   make up-signoz  # ch.10: + the SigNoz observability profile
#   make pipeline   # ch.7: start the jenkins/ compose project
#
# Profiles bound the footprint (PLAN item #3): `core` = app + db, and
# everything later chapters add gets its OWN profile so a 4GB laptop
# never has to run all of it. `make up` starts core only, by design.
# ch.10 adds the `signoz` profile: the official Foundry stack (ClickHouse
# + Keeper + Postgres + OTel collector + SigNoz, signoz/) folded into THIS
# project so the app reaches it on the shared signoz-network at
# http://signoz:4317 - no app-side change (PLAN, "ch.10 self-host plan",
# Option A). It is OFF unless you pass --profile signoz, so the heaviest
# thing in the course (≈1.1GB idle) never starts by accident.

services:
  app:
    build: .
    # ch.8: deploy.sh points this image at a pushed tag (APP_IMAGE) - the
    # same file, the same container, a DIFFERENT image. The default keeps
    # `make up` doing ch.4's local build; a bare local name (the .env
    # default) resolves from the local store, a registry name gets pulled.
    image: ${APP_IMAGE:-notes-app}
    profiles: ["core"]
    depends_on:
      # The app creates its tables at import time - so Postgres must be
      # accepting connections first. `service_healthy` (not just "started")
      # is what makes this reliable.
      db:
        condition: service_healthy
    environment:
      # The ch.2 seam pays off: models.py builds its engine from DATABASE_URL.
      # Point it at Postgres here and NOT ONE LINE OF PYTHON CHANGES.
      # Note the driver dialect `postgresql+psycopg` - SQLAlchemy needs the
      # driver named in the URL (that's why `uv add psycopg` happened).
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      # ch.6: the log level knob - behavior from the environment, not code.
      LOG_LEVEL: INFO
      # ch.9: tracing knobs, all environment-driven (ch.5's rule).
      # OTEL_ENABLED defaults on in code; say "false" to run a container
      # with zero OpenTelemetry. OTEL_EXPORTER picks the destination:
      # "console" (the ch.9 default - spans print to stdout, no new
      # containers) or "otlp" (ch.10 - gRPC to the SigNoz collector).
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-console}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-notes-app}
      # ch.10 destination: the SigNoz collector on the shared signoz-network.
      # ch.9's console exporter never reads this; it becomes active the
      # moment OTEL_EXPORTER flips to "otlp" (docs/10 step 3).
      OTEL_OTLP_ENDPOINT: ${OTEL_OTLP_ENDPOINT:-http://signoz:4317}
    # ch.10: join the app to the signoz-network too - that is how
    # http://signoz:4317 resolves to the ingester (its `signoz` alias).
    # A no-op while the signoz profile is down; the app's own traffic
    # (db, 8000) is unaffected by the extra network.
    networks:
      default:
      signoz-network:
    # ch.9: a readiness-gated liveness check, mirroring the Dockerfile's
    # HEALTHCHECK. Nothing depends on the app yet in ch.9 (the db already
    # has its own pg_isready check), but the endpoint now EXISTS, so a
    # later service - ch.10's log collector, or a load balancer - can
    # `depends_on: app: service_healthy` instead of guessing.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    profiles: ["core"]
    # .env (yours, gitignored - see .env.example) feeds these interpolations.
    # Compose reads .env to fill in ${...} in THIS file; the containers
    # themselves never see the raw .env - app gets only DATABASE_URL,
    # db gets only its three POSTGRES_* vars.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume = the data OUTLIVES the container. ch.4's
      # "docker rm loses everything" problem, solved for good.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready: "is Postgres accepting connections?" - the exact
      # question depends_on above is waiting on.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 2s
      retries: 20
    ports:
      - "5432:5432" # so you can psql into it from the host; `make check` verifies 5432 is free first

  # ch.7's Jenkins is NOT here on purpose: the CI server is its OWN
  # compose project, jenkins/docker-compose.yml - one file = one machine.
  #   make pipeline   # boots that project (see jenkins/docker-compose.yml)

  # =========================================================================
  # ch.10 - the SigNoz observability stack, as the `signoz` profile.
  #
  # Official Foundry layout (signoz/compose.yaml is the vendor reference;
  # signoz/README.md explains every piece). Folded into THIS project so
  # the app reaches the collector over the shared signoz-network at
  # http://signoz:4317 (PLAN "ch.10 self-host plan", Option A). The
  # profile is OFF unless --profile signoz is passed, so this ≈1.1GB
  # stack never starts with a plain `make up`.
  #
  #   make up-signoz    # core + signoz
  #
  # Bring-up order (do not "tidy" the names - the healthchecks and
  # service_completed_successfully reference them):
  #   keeper -> user-scripts job -> clickhouse -> migrator job ->
  #   collector (gates until clickhouse migrations complete) -> UI
  # =========================================================================

  # The OTel collector: the ONLY service that talks OTLP. Ingestion is on
  # 4317/4318; the `signoz` alias is what the app's OTEL_OTLP_ENDPOINT
  # resolves to. Its command first runs `migrate sync check` - the reason
  # data can lag a fresh boot by a minute or two (docs/10 pitfall).
  signoz-ingester:
    image: signoz/signoz-otel-collector:latest
    profiles: ["signoz"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    entrypoint: ["/bin/sh"]
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    networks:
      signoz-network:
        aliases: [signoz-ingester, signoz]
    ports:
      - "4317:4317"  # OTLP gRPC - the app's OTEL_OTLP_ENDPOINT target
      - "4318:4318"  # OTLP HTTP
    restart: unless-stopped
    volumes:
      - ./signoz/ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./signoz/ingester/opamp.yaml:/etc/opamp-config.yaml:ro

  # SigNoz UI + backend: your traces, metrics, and SLO alerts live here.
  # First visit: the "create admin account" step (docs/10) - no baked creds.
  signoz-signoz-0:
    image: signoz/signoz:latest
    profiles: ["signoz"]
    container_name: signoz-signoz-0
    environment:
      # ch.5's rule, applied to the observability box's OWN database: the
      # credentials are interpolated (${SIGNOZ_MG_*}, .env.example ships the
      # Foundry defaults), never hardcoded - so `make scan`'s
      # credential-shaped-URL rule stays meaningful (docs/10 pitfall #8).
      # The :- defaults mean a bare .env works exactly like the vendored
      # signoz/compose.yaml (Option B) does out of the box.
      - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://${SIGNOZ_MG_USER:-signoz}:${SIGNOZ_MG_PASSWORD:-signoz}@signoz-metastore-postgres-0:5432/${SIGNOZ_MG_DB:-signoz}?sslmode=disable
      - SIGNOZ_SQLSTORE_PROVIDER=postgres
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      start_period: 60s
      timeout: 10s
      retries: 3
    networks: [signoz-network]
    ports:
      - "8080:8080"  # the UI - `make check` verifies 8080 is free first
    restart: unless-stopped

  # The SigNoz stack's own metadata DB (alerts, dashboards, users).
  # Deliberately NOT published: this database is SigNoz's, not yours.
  signoz-metastore-postgres-0:
    image: postgres:16
    profiles: ["signoz"]
    container_name: signoz-metastore-postgres-0
    environment:
      - POSTGRES_DB=signoz
      - POSTGRES_USER=signoz
      - POSTGRES_PASSWORD=signoz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signoz -d signoz"]
      interval: 30s
      start_period: 30s
      timeout: 10s
      retries: 3
    networks: [signoz-network]
    restart: unless-stopped
    volumes:
      - signoz-metastore-postgres-0-data:/var/lib/postgresql/data

  # Coordination for the distributed ClickHouse (the keeper keeps replicas
  # in step). No ports, no user of its own - pure plumbing.
  signoz-telemetrykeeper-clickhousekeeper-0:
    image: clickhouse/clickhouse-keeper:25.12.5
    profiles: ["signoz"]
    container_name: signoz-telemetrykeeper-clickhousekeeper-0
    entrypoint: ["/usr/bin/clickhouse-keeper", "--config-file=/etc/clickhouse-keeper/keeper.yaml"]
    healthcheck:
      test: ["CMD", "clickhouse-keeper-client", "-h", "localhost", "-p", "9181", "-q", "ls"]
      interval: 30s
      start_period: 40s
      timeout: 10s
      retries: 3
    networks: [signoz-network]
    restart: unless-stopped
    volumes:
      - signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
      - ./signoz/telemetrykeeper/clickhousekeeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro

  # ClickHouse: where traces/metrics/logs are actually stored (~614MB of
  # the stack's ~1.1GB idle RAM). Waits for the keeper AND for the
  # user-scripts job to finish (one-shot job: it fetches the
  # histogram-quantile UDF from GitHub - the stack's only outbound call,
  # needs internet once per fresh volume).
  signoz-telemetrystore-clickhouse-0-0:
    image: clickhouse/clickhouse-server:25.12.5
    profiles: ["signoz"]
    container_name: signoz-telemetrystore-clickhouse-0-0
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      start_period: 40s
      timeout: 10s
      retries: 3
    networks: [signoz-network]
    restart: unless-stopped
    volumes:
      - signoz-telemetrystore-0-0-data:/var/lib/clickhouse
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - ./signoz/telemetrystore/clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./signoz/telemetrystore/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro

  # One-shot job (exits 0, sits "exited" - by design, restart only on
  # failure): downloads the ClickHouse UDF into the user_scripts volume.
  signoz-telemetrystore-clickhouse-user-scripts:
    image: clickhouse/clickhouse-server:25.12.5
    profiles: ["signoz"]
    container_name: signoz-telemetrystore-clickhouse-user-scripts
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    networks: [signoz-network]
    restart: on-failure
    volumes:
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts

  # One-shot job: runs SigNoz's schema migrations on a fresh ClickHouse,
  # then exits 0. The ingester's `migrate sync check` command waits for
  # THIS to finish - that ordering is why the first ingest can lag a
  # fresh boot (docs/10 pitfall #1).
  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:latest
    profiles: ["signoz"]
    container_name: signoz-telemetrystore-migrator
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    networks: [signoz-network]
    restart: on-failure

volumes:
  pgdata:
  # ch.10: the SigNoz stack's named volumes - telemetry OUTLIVES the
  # containers (the ch.4 "docker rm loses everything" lesson, applied).
  # `make down-signoz` stops the stack WITHOUT these; drop them (and your
  # traces) with `make reset-signoz`.
  signoz-metastore-postgres-0-data:
  signoz-telemetrykeeper-0-data:
  signoz-telemetrystore-0-0-data:
  signoz-telemetrystore-user-scripts:

# ch.10: the SigNoz stack's own network. The app joins it too (its
# `networks:` above) so OTEL_OTLP_ENDPOINT=http://signoz:4317 resolves to
# the ingester by the alias set on that service. `make up` (core only)
# still works: an empty network is a no-op.
networks:
  signoz-network:
